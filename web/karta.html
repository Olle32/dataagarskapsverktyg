<!DOCTYPE html>
<html lang="sv">
<head>

  <style>

<body>
  <h1>Dataägarskap och informationsflöden — Nordfordon AB (fiktivt exempel)</h1>
  <div id="graf"></div>

  <script>
    var cy = cytoscape({
      container: document.getElementById('graf'),
      elements: [{"data": {"id": "telemetri", "label": "Fordonstelemetri"}}, {"data": {"id": "produktion", "label": "Produktionssystem"}}, {"data": {"id": "erp", "label": "ERP"}}, {"data": {"id": "crm", "label": "CRM/Återförsäljarsystem"}}, {"data": {"id": "integrationslager", "label": "Integrationslager (legacy)"}}, {"data": {"id": "datalager", "label": "Datalager"}}, {"data": {"id": "rapportlager", "label": "Rapportlager (BI)"}}, {"data": {"id": "flow-0", "source": "telemetri", "target": "integrationslager", "label": "felkoder"}}, {"data": {"id": "flow-1", "source": "telemetri", "target": "integrationslager", "label": "matvarden"}}, {"data": {"id": "flow-2", "source": "integrationslager", "target": "datalager", "label": "felkoder"}}, {"data": {"id": "flow-3", "source": "integrationslager", "target": "datalager", "label": "matvarden"}}, {"data": {"id": "flow-4", "source": "produktion", "target": "datalager", "label": "komponentdata"}}, {"data": {"id": "flow-5", "source": "erp", "target": "produktion", "label": "komponentdata"}}, {"data": {"id": "flow-6", "source": "crm", "target": "datalager", "label": "kunduppgifter"}}, {"data": {"id": "flow-7", "source": "datalager", "target": "rapportlager", "label": "felkoder"}}, {"data": {"id": "flow-8", "source": "datalager", "target": "rapportlager", "label": "matvarden"}}, {"data": {"id": "flow-9", "source": "datalager", "target": "rapportlager", "label": "komponentdata"}}],

        { selector: 'edge', style: { 'label': 'data(label)', 'curve-style': 'bezier', 'target-arrow-shape': 'triangle', 'font-size': 10, 'color': '#555' } }
